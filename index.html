<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2fb" id="themeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="비서실">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>나의 비서실</title>
  <style>
    :root {
      --hue: 30;
      --bg: hsl(var(--hue) 45% 96%);
      --card: #ffffff;
      --text: #1f2330;
      --sub: #6b7080;
      --accent: hsl(var(--hue) 68% 46%);
      --on-accent: #ffffff;
      --accent-soft: hsl(var(--hue) 85% 94%);
      --line: hsl(var(--hue) 20% 90%);
      --shadow: 0 1px 2px rgba(20, 20, 40, .04), 0 8px 24px rgba(20, 20, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: hsl(var(--hue) 22% 9%);
        --card: hsl(var(--hue) 16% 14%);
        --text: #eceef4;
        --sub: #9aa0b2;
        --accent: hsl(var(--hue) 85% 72%);
        --on-accent: hsl(var(--hue) 40% 12%);
        --accent-soft: hsl(var(--hue) 30% 21%);
        --line: hsl(var(--hue) 14% 22%);
        --shadow: none;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); transition: background-color 1.2s; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(120% 50% at 50% -10%, var(--accent-soft), transparent 70%) no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      padding: max(20px, env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));
      line-height: 1.5;
      word-break: keep-all;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    header { margin: 8px 4px 18px; }
    .date { color: var(--sub); font-size: 14px; }
    h1 { margin: 2px 0 0; font-size: 22px; letter-spacing: -.02em; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .card-title { font-weight: 700; margin-bottom: 10px; }
    .sub { color: var(--sub); font-size: 14px; }
    .small { font-size: 13px; margin: 8px 0 0; }
    .grow { flex: 1; min-width: 0; }

    button {
      font: inherit;
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
      cursor: pointer;
      transition: transform .1s, background-color .3s;
    }
    button:active { transform: scale(.97); }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    button.link { background: none; color: var(--sub); padding: 6px 4px; font-weight: 400; font-size: 13px; text-decoration: underline; }
    button.big { font-size: 18px; padding: 18px; border-radius: 18px; }
    .wide { width: 100%; }
    input[type=text], input[type=time], textarea {
      font: inherit;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > input { flex: 1; }

    /* 하루 막대 */
    .daybar-wrap { cursor: pointer; margin-bottom: 18px; }
    .daybar { position: relative; display: flex; gap: 3px; height: 8px; }
    .daybar i { border-radius: 4px; background: hsl(var(--h) 70% 62%); }
    .daybar i.past { opacity: .28; }
    .marker {
      position: absolute; top: -5px; width: 4px; height: 18px; border-radius: 2px;
      background: var(--text); transform: translateX(-50%); transition: left .6s;
    }
    .daybar-labels { display: flex; justify-content: space-between; color: var(--sub); font-size: 11px; margin-top: 6px; }

    /* 지금 블록 */
    .hero-top { display: flex; gap: 14px; align-items: center; }
    .hero-emoji {
      font-size: 34px; width: 60px; height: 60px; flex: none;
      display: grid; place-items: center; border-radius: 18px; background: var(--accent-soft);
    }
    .hero-name { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
    .remain { font-size: 15px; font-weight: 700; color: var(--accent); margin-top: 16px; }
    .bar { height: 8px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .6s; }
    .insight { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 14px; display: grid; gap: 4px; }
    .section-title { font-size: 13px; color: var(--sub); margin: 20px 0 8px; font-weight: 600; }
    .actions { list-style: none; padding: 0; margin: 0; }
    .actions li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; cursor: pointer; }
    .actions li:first-child { border-top: 0; }
    .check {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none;
      display: grid; place-items: center; font-size: 13px; color: var(--on-accent); transition: all .2s;
    }
    .done .check { background: var(--accent); border-color: var(--accent); }
    .done span { color: var(--sub); text-decoration: line-through; }
    .energy { display: flex; gap: 8px; }
    .energy button { flex: 1; background: var(--bg); border: 1px solid var(--line); font-size: 26px; padding: 8px; display: grid; gap: 0; }
    .energy button small { font-size: 11px; color: var(--sub); font-weight: 500; }
    .energy button.on { border-color: var(--accent); background: var(--accent-soft); }
    .minimum { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 14px; }

    /* 오늘의 한 가지 */
    .one-thing {
      padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-weight: 700;
      display: flex; gap: 12px; align-items: center;
    }
    .check-btn {
      width: 28px; height: 28px; padding: 0; border-radius: 50%; flex: none;
      background: var(--card); border: 2px solid var(--accent);
    }
    .celebrate { font-size: 18px; }

    /* 집중 타이머 */
    .timer { text-align: center; }
    .timer-left { font-size: 52px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--accent); }

    .next { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

    /* 전체 리듬 */
    details summary { cursor: pointer; color: var(--sub); font-size: 14px; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    .timeline { margin-top: 12px; }
    .tl { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
    .tl .t { width: 76px; color: var(--sub); font-size: 13px; flex: none; }
    .tl .dot { width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) 70% 62%); flex: none; }
    .tl.past { opacity: .45; }
    .tl.cur b { color: var(--accent); }
    .tl.cur .dot { box-shadow: 0 0 0 4px var(--accent-soft); }

    /* 저녁 */
    .review { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .flow { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .flow span { text-align: center; font-size: 12px; color: var(--sub); padding: 6px 8px; border-radius: 12px; background: var(--bg); line-height: 1.4; }
    .flow b { display: block; font-size: 20px; }
    .worries { list-style: none; padding: 0; margin: 10px 0 0; }
    .worries li { color: var(--sub); font-size: 14px; padding: 4px 0; }
    .worries li::before { content: "🍃 "; }
    .floater {
      position: fixed; z-index: 20; pointer-events: none;
      padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); color: var(--text);
      animation: floatAway 2.4s ease-in forwards;
    }
    @keyframes floatAway {
      to { transform: translate(40px, -220px) rotate(-6deg) scale(.7); opacity: 0; }
    }

    /* 아침 */
    .wake-card { text-align: center; padding: 28px 20px 20px; overflow: hidden; }
    .sunrise {
      width: 96px; height: 96px; margin: 4px auto 16px; border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #fde68a, #f59e0b 70%);
      box-shadow: 0 0 60px rgba(245, 158, 11, .45);
      animation: rise 1.4s ease-out both;
    }
    @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
    .wake-card .hero-name { margin-bottom: 4px; }
    .wake-card .one-thing { justify-content: center; margin: 16px 0 0; }
    .wake-card .big { margin-top: 20px; }
    .mini { margin-top: 14px; text-align: left; }
    .mini summary { text-align: center; }
    .mini .row { margin-top: 10px; }
    .intro { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; color: var(--sub); }

    .hint { font-size: 13px; color: var(--sub); text-align: center; padding: 12px; border-radius: 14px; border: 1px dashed var(--line); margin-bottom: 12px; }

    /* 토스트 */
    .toast {
      position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top)); z-index: 30;
      transform: translate(-50%, -12px); opacity: 0; visibility: hidden;
      transition: transform .35s, opacity .35s, visibility .35s;
      background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

    /* 숨 고르기 */
    .breathe-btn {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
      bottom: max(20px, env(safe-area-inset-bottom));
      border-radius: 999px; padding: 14px 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
    }
    .breathe-btn:active { transform: translateX(-50%) scale(.97); }
    .overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 36px; padding: 24px; z-index: 40;
    }
    .overlay.show { display: flex; }
    .circle {
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, var(--accent-soft) 70%);
      transform: scale(.8);
      transition-property: transform; transition-timing-function: ease-in-out;
    }
    .phase { font-size: 22px; font-weight: 700; text-align: center; min-height: 33px; }

    /* 탭 */
    .tabs {
      display: flex; gap: 4px; padding: 4px; margin-bottom: 14px;
      border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
      position: sticky; top: max(8px, env(safe-area-inset-top)); z-index: 6;
    }
    .tabs button { flex: 1; background: none; color: var(--sub); padding: 10px 4px; border-radius: 12px; font-size: 14px; }
    .tabs button.on { background: var(--accent-soft); color: var(--accent); }

    /* 선택 칩 */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: var(--bg); color: var(--text); border: 1px solid var(--line);
      padding: 9px 13px; border-radius: 999px; font-weight: 500; font-size: 14px;
    }
    .chip.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
    .tag {
      display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
      background: var(--card); color: var(--sub); border: 1px solid var(--line);
    }
    button:disabled { opacity: .4; cursor: default; }
    .suggest { display: grid; gap: 10px; }
    .suggest p { margin: 0; }
    .anchor { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--sub); display: grid; gap: 4px; }

    /* 삶의 방향 */
    .goal { font-size: 19px; font-weight: 800; line-height: 1.45; letter-spacing: -.01em; }
    .pipes { display: grid; gap: 10px; }
    .pipe { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--bg); }
    .pipe .em { font-size: 24px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--card); flex: none; }
    .principles { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
    .vs { display: grid; gap: 8px; font-size: 14px; }
    .vs div { padding: 10px 12px; border-radius: 12px; background: var(--bg); }
    .vs b { display: block; }
    .quote { font-size: 15px; font-weight: 600; line-height: 1.6; border-left: 3px solid var(--accent); padding-left: 12px; }
    .edit-pipe { display: grid; grid-template-columns: 56px 1fr; gap: 8px; margin-bottom: 14px; }
    .edit-pipe input:last-child { grid-column: 2; }

    /* 기록 */
    .day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .day-lines { display: grid; gap: 4px; font-size: 14px; }

    footer { margin-top: 20px; color: var(--sub); font-size: 12px; text-align: center; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="date" id="today"></div>
      <h1 id="title">오늘도 나의 방향대로</h1>
    </header>
    <nav class="tabs" id="tabs">
      <button data-tab="today" class="on">☀️ 오늘</button>
      <button data-tab="compass">🧭 삶의 방향</button>
      <button data-tab="records">📒 기록</button>
    </nav>
    <main id="app"></main>
    <div id="install"></div>
    <footer>v0.4 · 나의 비서실 · 블록 시간은 일반적인 기본값이에요</footer>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <button class="breathe-btn" id="breatheBtn">🫁 숨 고르기</button>
  <div class="overlay" id="overlay" role="dialog" aria-label="숨 고르기">
    <div class="circle" id="circle"></div>
    <div>
      <div class="phase" id="phase">준비</div>
      <div class="sub" id="phaseSub" style="text-align:center"></div>
    </div>
    <button class="ghost" id="breatheClose">닫기</button>
  </div>

  <script>
    const KEY = 'rhythm.v1';
    const HIST = 'rhythm.history';
    const MIN = 60 * 1000;
    const DAY_LENGTH = 20 * 60; // 기상 후 20시간이 지나면 새 하루로 봄
    const EMO = ['😫', '😐', '🙂'];
    const EMO_LABEL = ['힘들어요', '그럭저럭', '괜찮아요'];

    // start/end: 기상 후 몇 분, hue: 블록 색
    const BLOCKS = [
      { id: 'wake', emoji: '☀️', name: '깨우기', start: 0, end: 60, hue: 30,
        state: '몸과 뇌가 켜지는 중이에요',
        actions: ['햇빛 10분 쬐기 (창가도 좋아요)', '물 한 잔 마시기', '카페인은 1시간쯤 뒤에'],
        minimum: '커튼만 열어도 충분해요',
        nudge: '좋은 아침이에요. 햇빛부터 조금 볼까요?' },
      { id: 'focus', emoji: '🔥', name: '집중 골든타임', start: 60, end: 240, hue: 14,
        state: '집중력과 분석력이 가장 높은 시간이에요',
        actions: ['오늘의 한 가지부터', '90분 집중 → 10분 휴식', '알림·메신저 잠시 끄기'],
        minimum: '25분만 해도 충분해요. 시작한 것 자체가 잘한 거예요',
        nudge: '골든타임이 시작됐어요. 오늘의 한 가지만 해볼까요?' },
      { id: 'social', emoji: '💬', name: '소통·잡무', start: 240, end: 360, hue: 200,
        state: '아직 괜찮지만 조금씩 내려가는 중이에요',
        actions: ['연락 · 회의 · 메일', '정리 같은 가벼운 일', '점심 챙겨 먹기'],
        minimum: '답장 하나만 보내도 OK',
        nudge: '집중 시간 수고했어요. 이제 가벼운 일들 차례예요.' },
      { id: 'dip', emoji: '😴', name: '오후 처짐', start: 360, end: 480, hue: 268,
        state: '졸리고 집중이 떨어지는 게 정상이에요',
        actions: ['20분 낮잠 또는 10분 산책', '단순한 작업만', '물 마시기'],
        minimum: '눈 감고 5분만 쉬어요',
        nudge: '졸린 시간이 왔어요. 10분만 걸어볼까요?' },
      { id: 'rise', emoji: '🌊', name: '2차 상승', start: 480, end: 660, hue: 172,
        state: '몸과 창의력이 다시 올라오는 시간이에요',
        actions: ['운동이나 몸 움직이기', '아이디어 · 창작 작업', '좋아하는 취미'],
        minimum: '스트레칭 5분',
        nudge: '에너지가 다시 올라오는 시간이에요. 몸을 움직여 볼까요?' },
      { id: 'wind', emoji: '🌙', name: '감속', start: 660, end: 840, hue: 238,
        state: '잠들 준비를 시작할 시간이에요',
        actions: ['조명 낮추기', '화면 줄이기', '걱정 내려놓기 · 내일 한 가지 정하기'],
        minimum: '폰 밝기만 낮춰도 좋아요',
        nudge: '천천히 속도를 줄일 시간이에요. 조명을 낮춰볼까요?' },
      { id: 'sleep', emoji: '💤', name: '잘 준비', start: 840, end: 960, hue: 222,
        state: '이제 쉬어도 돼요',
        actions: ['따뜻한 샤워', '폰은 손 닿지 않는 곳에', '오늘도 수고했어요'],
        minimum: '누워서 숨 고르기 한 번',
        nudge: '오늘도 수고했어요. 이제 잘 준비해요.' },
    ];
    const LAST = BLOCKS[BLOCKS.length - 1];

    const COMPASS = 'rhythm.compass';
    const LOG = 'rhythm.days';
    const TITLES = { today: '오늘도 나의 방향대로', compass: '삶의 방향', records: '나의 기록' };
    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

    const CHECKIN = {
      energy: { q: '지금 나의 에너지는?', opts: [['☀️', '매우 좋음'], ['🙂', '보통'], ['😮‍💨', '조금 지침'], ['🌧️', '많이 지침']] },
      concern: { q: '지금 가장 신경 쓰이는 것은?', opts: [['💰', '경제적 문제'], ['🔮', '미래에 대한 불안'], ['🪞', '자기비판과 열등감'], ['💪', '일과 피로'], ['🍀', '특별한 고민 없음']] },
      need: { q: '오늘 나에게 필요한 것은?', opts: [['🌿', '차분하게 하루 보내기'], ['🎯', '작은 목표 하나 달성하기'], ['📚', '새로운 것 배우기'], ['🛌', '충분히 쉬기']] },
    };
    // 기분은 확인하되 결정권을 넘기지 않는다: 하루의 크기는 조절하고 방향은 유지
    const SUGGEST = {
      energy: [
        '에너지가 좋은 날이에요. 그래도 일정을 늘리기보다 한 가지를 깊게 해봐요.',
        '평소대로 리듬을 따라가요.',
        '조금 지친 날이에요. 계획은 그대로 두고 크기만 줄여요. 블록마다 최소 버전을 보여줄게요.',
        '많이 지친 날이에요. 오늘은 최소 버전 하루예요. 방향은 그대로, 크기만 아주 작게요.',
      ],
      concern: [
        '돈 걱정이 크게 느껴져도 오늘 하루가 경제적 독립을 결정하진 않아요. 오늘 할 수 있는 작은 한 걸음만 보면 돼요.',
        '미래는 오늘 다 풀 수 없어요. 불안은 저녁에 내려놓기 칸에 맡기고, 지금은 이 블록에만 있어요.',
        '남의 속도가 아니라 내 방향이 기준이에요. 부족한 것만 말고 지금 실제로 만들어가고 있는 것도 같이 봐요.',
        '피곤하다고 목표를 포기할 필요는 없어요. 대신 오늘은 오후 처짐 블록에 꼭 쉬어요.',
        '마음이 가벼운 날이에요. 이 감각을 기억해 둬요.',
      ],
      need: [
        '오늘의 한 가지는 작게 잡고, 숨 고르기를 자주 해요.',
        '골든타임에 오늘의 한 가지를 정하고 25분만 시작해요.',
        '배우기는 몸과 창의력이 다시 올라오는 2차 상승 블록이 좋아요.',
        '오늘은 쉬는 게 할 일이에요. 휴식도 정상적인 선택이에요.',
      ],
    };
    const CLOSING = [
      ['🌱', '한 걸음 나아갔어요', '작은 걸음이 쌓여서 방향이 돼요.'],
      ['🛌', '잘 쉬었어요', '쉬는 것도 정상적인 선택이에요. 내일의 에너지가 됐어요.'],
      ['🌧️', '버텼어요', '힘든 날을 버틴 것도 해낸 거예요.'],
      ['🍃', '그냥 흘러갔어요', '성과가 없어 보여도 오늘이 무의미했던 건 아니에요.'],
    ];
    const MOOD_VS_DIRECTION = [
      ['오늘 너무 피곤하다', '그렇다고 인생의 목표를 포기할 필요는 없어요'],
      ['오늘 아무것도 하기 싫다', '그렇다고 게으른 사람이 되는 건 아니에요'],
      ['오늘 돈을 많이 쓰고 후회한다', '그렇다고 경제적 독립이 불가능해지는 건 아니에요'],
      ['오늘 성과가 없다', '그렇다고 오늘이 무의미했던 건 아니에요'],
    ];
    const DEFAULT_COMPASS = {
      goal: '경제적 독립과 자기 성장, 그리고 스스로를 존중하면서 살아가는 삶',
      pipelines: [
        { emoji: '🧹', name: '청소업', purpose: '경제적 안정과 현금흐름' },
        { emoji: '🛠️', name: '반복숙련기술업', purpose: '기술 축적과 독립적인 수익' },
        { emoji: '💻', name: '온라인 불로소득업', purpose: '디지털 자산과 확장성' },
      ],
      principles: [
        '돈을 버는 것과 삶을 즐기는 것을 양립시키기',
        '생산성이 낮은 날에도 자신을 비난하지 않기',
        '다른 사람의 기준보다 나의 방향을 중요하게 생각하기',
        '경제적 목표가 나의 존재 가치를 결정하지 않도록 하기',
      ],
    };

    function loadKey(k, fallback) {
      try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; }
    }
    function saveKey(k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
    }
    const fresh = (s = {}) => ({
      focusTask: '', focusPipe: null, focusDone: false, tomorrowTask: '', energy: {}, done: {}, worries: [], sessions: 0,
      timer: null, checkin: null, checkinSkipped: false, closing: null, ...s,
    });
    let state = fresh(loadKey(KEY, {}));
    let history = loadKey(HIST, []); // [{ d: 'YYYY-M-D', wake }]
    let compass = { ...DEFAULT_COMPASS, ...loadKey(COMPASS, {}) };
    let dayLog = loadKey(LOG, []); // 지난 하루들의 기록 (주간 점검·장기 분석의 재료)
    const save = () => saveKey(KEY, state);
    let tab = 'today';
    let editingWake = false;
    let editingCompass = false;
    let lastBlockId = null;
    // 화면을 다시 그리지 않고 고르는 중인 값들
    let checkinDraft = {};
    let pipeDraft = null;
    let closingDraft = null;
    let closingPrefill = {};

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (t) => new Date(t).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
    const fmtMin = (m) => fmt(new Date(2000, 0, 1, Math.floor(m / 60), m % 60).getTime());
    const fmtDur = (m) => {
      const h = Math.floor(m / 60), r = Math.round(m % 60);
      return h ? `${h}시간${r ? ` ${r}분` : ''}` : `${r}분`;
    };
    const at = (min) => state.wake + min * MIN;
    const elapsed = () => (Date.now() - state.wake) / MIN;
    const dayActive = () => state.wake && elapsed() >= 0 && elapsed() < DAY_LENGTH;
    const buzz = (p) => {
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      try { navigator.vibrate?.(p); } catch {}
    };

    function currentBlock() {
      const e = elapsed();
      return BLOCKS.find((b) => e >= b.start && e < b.end) || LAST;
    }

    // ---------- 기상 기록 ----------

    const dateKey = (t) => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
    const minuteOfDay = (t) => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };
    function recordWake(t) {
      history = history.filter((h) => h.d !== dateKey(t));
      history.push({ d: dateKey(t), wake: t });
      history = history.slice(-30);
      saveKey(HIST, history);
    }
    function forgetWake(t) {
      history = history.filter((h) => h.wake !== t);
      saveKey(HIST, history);
    }
    function avgWake(except) {
      const recent = history.filter((h) => h.wake !== except).slice(-7);
      if (recent.length < 2) return null;
      return Math.round(recent.reduce((a, h) => a + minuteOfDay(h.wake), 0) / recent.length);
    }

    // ---------- 하루 시작 ----------

    function archiveDay() {
      if (!state.wake) return;
      const { timer, ...record } = state;
      dayLog = dayLog.filter((d) => d.wake !== state.wake);
      dayLog.push(record);
      dayLog = dayLog.slice(-400);
      saveKey(LOG, dayLog);
    }

    const pipeOptions = () => [...compass.pipelines, { emoji: '🌿', name: '나를 위한 것' }];
    const pipeTag = (p) => (p ? `<span class="tag">${esc(p.emoji)} ${esc(p.name)}</span>` : '');
    function todayPrinciple() {
      const list = compass.principles.filter(Boolean);
      return list.length ? list[Math.floor((state.wake || Date.now()) / 86400000) % list.length] : '';
    }

    function startDay(wake) {
      archiveDay();
      state = fresh({ wake, focusTask: state.tomorrowTask || '' });
      checkinDraft = {};
      editingWake = false;
      recordWake(wake);
      save();
      askNotify();
      render();
    }

    function timeInputToStamp(value) {
      const [h, m] = value.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      if (d.getTime() > Date.now()) d.setDate(d.getDate() - 1);
      return d.getTime();
    }

    function nowHHMM() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ---------- 화면 ----------

    function wakeView() {
      const carry = state.tomorrowTask;
      const avg = avgWake();
      const firstTime = history.length === 0;
      return `
        <section class="card wake-card">
          <div class="sunrise"></div>
          <div class="hero-name">좋은 아침이에요</div>
          <div class="sub">일어난 시각을 기준으로 오늘 하루 리듬을 짜드릴게요.</div>
          ${avg != null ? `<p class="sub small">최근 평균 기상 ${fmtMin(avg)}</p>` : ''}
          <p class="sub small">🧭 ${esc(compass.goal)}</p>
          ${carry ? `<div class="one-thing">🎯 오늘의 한 가지: ${esc(carry)}</div>` : ''}
          <button class="big wide" data-act="wake-now">☀️ 일어났어요</button>
          <details class="mini">
            <summary>조금 전에 일어났다면</summary>
            <div class="row">
              <input type="time" id="wakeTime" value="${nowHHMM()}">
              <button class="ghost" data-act="wake-at">이 시각으로</button>
            </div>
          </details>
        </section>
        ${firstTime ? `
        <section class="card">
          <div class="card-title">이렇게 도와줄게요</div>
          <ul class="intro">
            <li>일어난 시각부터 뇌 컨디션 흐름에 맞춰 하루를 7개 블록으로 나눠요</li>
            <li>지금 블록 하나만 보여줘요. 놓친 건 그냥 다음 블록으로 넘어가요</li>
            <li>힘든 날엔 최소 버전만 하면 돼요</li>
          </ul>
        </section>` : ''}`;
    }

    function dayBar() {
      return `
        <div class="daybar-wrap" data-act="open-timeline" aria-label="오늘 전체 리듬 보기">
          <div class="daybar">
            ${BLOCKS.map((x) => `<i style="flex:${x.end - x.start};--h:${x.hue}" data-end="${x.end}"></i>`).join('')}
            <b class="marker" id="marker"></b>
          </div>
          <div class="daybar-labels"><span>기상 ${fmt(state.wake)}</span><span>취침 ${fmt(at(LAST.end))}</span></div>
        </div>`;
    }

    function wakeInsight() {
      const lines = [];
      const avg = avgWake(state.wake);
      if (avg != null) {
        let diff = minuteOfDay(state.wake) - avg;
        diff = ((diff + 720) % 1440 + 1440) % 1440 - 720;
        lines.push(Math.abs(diff) <= 30
          ? '👍 평소와 비슷한 시각에 일어났어요. 리듬이 안정적이에요'
          : `${diff > 0 ? '⏰' : '🌅'} 평소보다 ${fmtDur(Math.abs(diff))} ${diff > 0 ? '늦게' : '일찍'} 일어났어요. 괜찮아요, 오늘 리듬은 지금부터예요`);
      }
      lines.push(`🛏 오늘 목표 취침 ${fmt(at(LAST.end))}`);
      return `<div class="insight">${lines.map((l) => `<div>${l}</div>`).join('')}</div>`;
    }

    function timerCard() {
      return `
        <section class="card timer">
          <div class="sub">⏱ ${state.timer.min}분 집중 중${state.focusTask ? ` · ${esc(state.focusTask)}` : ''}</div>
          <div class="timer-left" id="timerLeft">--:--</div>
          <div class="bar"><i id="timerBar"></i></div>
          <button class="link" data-act="stop-timer">그만하기</button>
        </section>`;
    }

    function oneThingCard() {
      let body;
      if (!state.focusTask) {
        const resting = state.checkin?.need === 3;
        body = `
          <div class="sub" style="margin-bottom:10px">${resting
            ? '쉬는 날이라 비워둬도 괜찮아요. 정한다면 아주 작게요.'
            : '골든타임에 할 일 딱 하나만 정해요. 나머지는 다 보너스예요.'}</div>
          <div class="row">
            <input type="text" id="focusInput" placeholder="예: 견적서 하나 보내기" enterkeyhint="done" data-enter="set-focus">
            <button data-act="set-focus">정하기</button>
          </div>
          <div class="section-title">어느 방향과 이어지나요? (선택)</div>
          <div class="chips">
            ${pipeOptions().map((p, i) => `<button class="chip ${pipeDraft === i ? 'on' : ''}" data-act="pick-pipe" data-v="${i}">${esc(p.emoji)} ${esc(p.name)}</button>`).join('')}
          </div>`;
      } else if (state.focusDone) {
        body = `
          <div class="one-thing celebrate">🎉 <span class="grow">${esc(state.focusTask)}<div>${pipeTag(state.focusPipe)}</div></span></div>
          <p class="sub small">끝냈어요! 남은 하루는 전부 보너스예요. <button class="link" data-act="focus-undo">되돌리기</button></p>`;
      } else {
        body = `
          <div class="one-thing">
            <button class="check-btn" data-act="focus-done" aria-label="끝냈어요"></button>
            <span class="grow">${esc(state.focusTask)}<div>${pipeTag(state.focusPipe)}</div></span>
            <button class="link" data-act="clear-focus">바꾸기</button>
          </div>
          ${state.timer ? '' : `
          <div class="row" style="margin-top:10px">
            <button class="ghost grow" data-act="timer" data-min="25">▶ 25분 집중</button>
            <button class="ghost grow" data-act="timer" data-min="90">▶ 90분 집중</button>
          </div>`}`;
      }
      return `
        <section class="card">
          <div class="card-title">🎯 오늘의 한 가지</div>
          ${body}
          ${state.sessions ? `<p class="sub small">오늘 집중 ${state.sessions}회 했어요</p>` : ''}
        </section>`;
    }

    function checkinCard() {
      if (state.checkin) {
        const c = state.checkin;
        const keys = ['energy', 'concern', 'need'].filter((k) => c[k] != null);
        return `
          <section class="card">
            <div class="card-title">💬 오늘의 제안</div>
            <div class="chips" style="gap:6px; margin-bottom:12px">
              ${keys.map((k) => { const [e, t] = CHECKIN[k].opts[c[k]]; return `<span class="tag">${e} ${t}</span>`; }).join('')}
            </div>
            <div class="suggest">${keys.map((k) => `<p>${SUGGEST[k][c[k]]}</p>`).join('')}</div>
            <div class="anchor">
              <div>🧭 ${esc(compass.goal)}</div>
              ${todayPrinciple() ? `<div>📌 ${esc(todayPrinciple())}</div>` : ''}
            </div>
            <div style="text-align:right"><button class="link" data-act="ci-redo">상태 다시 체크</button></div>
          </section>`;
      }
      if (state.checkinSkipped) {
        return `
          <section class="card next" data-act="ci-open" style="cursor:pointer">
            <div><b>🌤 오늘의 상태 확인하기</b><div class="sub" style="font-size:13px">30초면 돼요. 상태에 맞춰 하루의 크기를 조절해 줄게요.</div></div>
            <div class="sub">›</div>
          </section>`;
      }
      return `
        <section class="card">
          <div class="card-title">🌤 오늘은 어떤 상태인가요?</div>
          <div class="sub">기분은 오늘의 것이고, 방향은 그대로예요. 상태에 맞춰 크기만 조절할게요.</div>
          ${Object.entries(CHECKIN).map(([k, g]) => `
            <div class="section-title">${g.q}</div>
            <div class="chips">
              ${g.opts.map(([e, t], i) => `<button class="chip ${checkinDraft[k] === i ? 'on' : ''}" data-act="ci" data-k="${k}" data-v="${i}">${e} ${t}</button>`).join('')}
            </div>`).join('')}
          <button class="wide" style="margin-top:18px" id="ciSave" data-act="ci-save" ${checkinDraft.energy == null ? 'disabled' : ''}>오늘의 상태 기록하기</button>
          <div style="text-align:center"><button class="link" data-act="ci-skip">나중에 할게요</button></div>
        </section>`;
    }

    function closingCard() {
      if (state.closing) {
        const [e, t, msg] = CLOSING[state.closing.kind] || CLOSING[3];
        return `
          <section class="card">
            <div class="card-title">🌙 하루 마무리</div>
            <div class="one-thing">${e} ${t}</div>
            ${state.closing.step ? `<p class="small">🧭 방향으로 한 걸음: ${esc(state.closing.step)}</p>` : ''}
            ${state.closing.line ? `<p class="small">✍️ ${esc(state.closing.line)}</p>` : ''}
            <p class="sub small">${msg} <button class="link" data-act="closing-edit">수정</button></p>
          </section>`;
      }
      return `
        <section class="card">
          <div class="card-title">🌙 하루 마무리</div>
          <div class="sub" style="margin-bottom:10px">기분이 어땠든, 오늘은…</div>
          <div class="chips">
            ${CLOSING.map(([e, t], i) => `<button class="chip ${closingDraft === i ? 'on' : ''}" data-act="pick-closing" data-v="${i}">${e} ${t}</button>`).join('')}
          </div>
          <div class="section-title">오늘 내 방향으로 움직인 것 (작아도, 쉰 것도 괜찮아요)</div>
          <input type="text" id="closingStep" value="${esc(closingPrefill.step || '')}" placeholder="예: 견적 문의에 답했다 / 푹 잤다">
          <div class="section-title">한 줄 기록</div>
          <input type="text" id="closingLine" value="${esc(closingPrefill.line || '')}" placeholder="오늘을 한 줄로">
          <button class="wide" style="margin-top:14px" id="closingSave" data-act="save-closing" ${closingDraft == null ? 'disabled' : ''}>하루 마무리하기</button>
        </section>`;
    }

    function eveningCards() {
      const items = [];
      if (state.focusDone && state.focusTask) items.push(`🎯 오늘의 한 가지: ${esc(state.focusTask)} ${pipeTag(state.focusPipe)}`);
      if (state.sessions) items.push(`⏱ 집중 ${state.sessions}회`);
      for (const k of Object.keys(state.done)) {
        if (!state.done[k]) continue;
        const [id, i] = k.split('.');
        const bl = BLOCKS.find((x) => x.id === id);
        if (bl && bl.actions[i]) items.push(`${bl.emoji} ${esc(bl.actions[i])}`);
      }
      const flow = BLOCKS.filter((x) => state.energy[x.id] != null);
      return `
        <section class="card">
          <div class="card-title">🌙 오늘 돌아보기</div>
          ${items.length
            ? `<ul class="review">${items.map((t) => `<li>${t}</li>`).join('')}</ul>`
            : `<div class="sub">오늘은 그냥 흘러간 하루여도 괜찮아요. 여기까지 온 것만으로 충분해요.</div>`}
          ${flow.length ? `
            <div class="section-title">컨디션 흐름</div>
            <div class="flow">${flow.map((x) => `<span><b>${EMO[state.energy[x.id]]}</b>${x.emoji}</span>`).join('')}</div>` : ''}
        </section>

        ${closingCard()}

        <section class="card">
          <div class="card-title">🍃 걱정 내려놓기</div>
          <textarea id="worryInput" placeholder="머릿속에 맴도는 걸 그냥 적어요. 적으면 여기 두고 가는 거예요."></textarea>
          <button class="ghost wide" style="margin-top:8px" data-act="add-worry">내려놓기</button>
          ${state.worries.length ? `
            <details style="margin-top:12px">
              <summary>오늘 내려놓은 걱정 ${state.worries.length}개</summary>
              <ul class="worries">${state.worries.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>
            </details>` : ''}
        </section>

        <section class="card">
          <div class="card-title">🎯 내일 골든타임에 할 한 가지</div>
          ${state.tomorrowTask
            ? `<div class="one-thing"><span class="grow">${esc(state.tomorrowTask)}</span><button class="link" data-act="clear-tomorrow">바꾸기</button></div>
               <p class="sub small">내일 아침에 그대로 이어서 보여줄게요.</p>`
            : `<div class="row"><input type="text" id="tomorrowInput" placeholder="딱 하나만" enterkeyhint="done" data-enter="set-tomorrow"><button data-act="set-tomorrow">정하기</button></div>`}
        </section>`;
    }

    function nowView() {
      const b = currentBlock();
      const e = elapsed();
      const over = e >= LAST.end;
      const next = BLOCKS[BLOCKS.indexOf(b) + 1];
      const energy = state.energy[b.id];
      const evening = b.id === 'wind' || b.id === 'sleep';
      // 아침에 지쳤다고 했으면, 블록에서 따로 답하지 않는 한 최소 버전을 기본으로 보여줌
      const tired = state.checkin?.energy >= 2;
      const showMinimum = energy === 0 || (energy == null && tired);

      const actions = b.actions.map((a, i) => {
        const done = state.done[`${b.id}.${i}`];
        return `<li class="${done ? 'done' : ''}" data-act="toggle" data-key="${b.id}.${i}">
          <div class="check">${done ? '✓' : ''}</div><span>${esc(a)}</span></li>`;
      }).join('');

      return `
        ${state.timer ? timerCard() : ''}

        ${checkinCard()}

        <section class="card">
          ${dayBar()}
          <div class="hero-top">
            <div class="hero-emoji">${b.emoji}</div>
            <div>
              <div class="hero-name">${b.name}</div>
              <div class="sub">${b.state}</div>
            </div>
          </div>
          <div class="remain" id="remain"></div>
          <div class="bar"><i id="bar"></i></div>
          ${b.id === 'wake' ? wakeInsight() : ''}

          <div class="section-title">지금 하면 좋은 것</div>
          <ul class="actions">${actions}</ul>

          <div class="section-title">지금 컨디션은?</div>
          <div class="energy">
            ${EMO.map((em, i) => `<button class="${energy === i ? 'on' : ''}" data-act="energy" data-v="${i}" aria-label="${EMO_LABEL[i]}">${em}<small>${EMO_LABEL[i]}</small></button>`).join('')}
          </div>
          ${showMinimum ? `<div class="minimum">💜 ${energy === 0 ? '지금은 최소 버전으로 가요.' : '지친 날이라 최소 버전을 보여줄게요.'} <b>${esc(b.minimum)}</b></div>` : ''}
        </section>

        ${evening ? eveningCards() : oneThingCard()}

        <section class="card next">
          ${next && !over
            ? `<div><div class="sub" style="font-size:12px">다음</div><b>${next.emoji} ${next.name}</b></div><div class="sub">${fmt(at(next.start))}</div>`
            : `<div><b>오늘 리듬 끝</b><div class="sub" style="font-size:13px">${over ? '잘 시간이 지났어요. 푹 자요 💤' : '푹 쉬어요'}</div></div>`}
        </section>

        <section class="card">
          <details id="tl">
            <summary>📋 오늘 전체 리듬 보기</summary>
            <div class="timeline">
              ${BLOCKS.map((x) => `
                <div class="tl ${x === b ? 'cur' : (e >= x.end ? 'past' : '')}" style="--h:${x.hue}">
                  <div class="t">${fmt(at(x.start))}</div>
                  <div class="dot"></div>
                  <div>${x.emoji} <b>${x.name}</b></div>
                </div>`).join('')}
            </div>
            <div style="margin-top:12px">
              ${editingWake
                ? `<div class="row"><input type="time" id="wakeTime" value="${new Date(state.wake).toTimeString().slice(0, 5)}"><button class="ghost" data-act="wake-fix">수정</button></div>`
                : `<button class="link" data-act="edit-wake">기상 시각 수정</button>`}
            </div>
          </details>
        </section>

        <button class="ghost wide" data-act="reset">🔄 초기화</button>`;
    }

    function compassView() {
      if (editingCompass) {
        return `
          <section class="card">
            <div class="card-title">궁극적인 목표</div>
            <textarea id="cGoal">${esc(compass.goal)}</textarea>
          </section>
          <section class="card">
            <div class="card-title">나의 파이프라인</div>
            ${compass.pipelines.map((p, i) => `
              <div class="edit-pipe">
                <input type="text" id="cpE${i}" value="${esc(p.emoji)}" aria-label="아이콘" style="text-align:center">
                <input type="text" id="cpN${i}" value="${esc(p.name)}" placeholder="이름">
                <input type="text" id="cpP${i}" value="${esc(p.purpose)}" placeholder="목적">
              </div>`).join('')}
          </section>
          <section class="card">
            <div class="card-title">내가 지키고 싶은 삶의 원칙</div>
            <div class="sub" style="margin-bottom:8px">한 줄에 하나씩 적어요</div>
            <textarea id="cPrin" style="min-height:150px">${esc(compass.principles.join('\n'))}</textarea>
          </section>
          <div class="row">
            <button class="ghost grow" data-act="compass-cancel">취소</button>
            <button class="grow" data-act="compass-save">저장</button>
          </div>`;
      }
      return `
        <section class="card">
          <div class="sub" style="margin-bottom:6px">궁극적인 목표</div>
          <div class="goal">${esc(compass.goal)}</div>
        </section>

        <section class="card">
          <div class="card-title">나의 파이프라인</div>
          <div class="pipes">
            ${compass.pipelines.map((p, i) => `
              <div class="pipe">
                <div class="em">${esc(p.emoji)}</div>
                <div><b>${'①②③④⑤'[i] || ''} ${esc(p.name)}</b><div class="sub">${esc(p.purpose)}</div></div>
              </div>`).join('')}
          </div>
        </section>

        <section class="card">
          <div class="card-title">내가 지키고 싶은 삶의 원칙</div>
          <ul class="principles">${compass.principles.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>
        </section>

        <section class="card">
          <div class="card-title">기분과 방향은 달라요</div>
          <div class="vs">${MOOD_VS_DIRECTION.map(([a, b]) => `<div><b>${a}</b><span class="sub">→ ${b}</span></div>`).join('')}</div>
        </section>

        <section class="card">
          <div class="quote">이 비서는 나를 더 생산적인 사람으로 만들려는 게 아니라, 내가 원하는 삶을 지속하도록 돕기 위해 있어요.</div>
        </section>

        <button class="ghost wide" data-act="compass-edit">✏️ 삶의 방향 수정</button>`;
    }

    function dayRecord(d, label) {
      const c = d.checkin;
      const tags = c ? ['energy', 'concern', 'need'].filter((k) => c[k] != null)
        .map((k) => { const [e, t] = CHECKIN[k].opts[c[k]]; return `<span class="tag">${e} ${t}</span>`; }).join('') : '';
      const lines = [];
      if (d.focusTask) lines.push(`🎯 ${esc(d.focusTask)}${d.focusDone ? ' ✅' : ''} ${pipeTag(d.focusPipe)}`);
      if (d.sessions) lines.push(`⏱ 집중 ${d.sessions}회`);
      if (d.closing) {
        const [e, t] = CLOSING[d.closing.kind] || CLOSING[3];
        lines.push(`${e} ${t}`);
        if (d.closing.step) lines.push(`🧭 ${esc(d.closing.step)}`);
        if (d.closing.line) lines.push(`✍️ ${esc(d.closing.line)}`);
      }
      if (d.worries?.length) lines.push(`🍃 내려놓은 걱정 ${d.worries.length}개`);
      const dt = new Date(d.wake);
      return `
        <section class="card">
          <div class="day-head">
            <b>${label ? `${label} · ` : ''}${dt.getMonth() + 1}월 ${dt.getDate()}일 (${WEEKDAYS[dt.getDay()]})</b>
            <span class="sub" style="font-size:13px">기상 ${fmt(d.wake)}</span>
          </div>
          ${tags ? `<div class="chips" style="gap:6px; margin-bottom:8px">${tags}</div>` : ''}
          <div class="day-lines">${lines.length ? lines.map((l) => `<div>${l}</div>`).join('') : '<div class="sub">조용히 지나간 하루</div>'}</div>
        </section>`;
    }

    function recordsView() {
      const list = [...dayLog].reverse().map((d) => dayRecord(d));
      if (state.wake) list.unshift(dayRecord(state, dayActive() ? '오늘' : ''));
      return `
        <section class="card">
          <div class="sub">매일의 상태와 마무리가 여기 쌓여요. 나중에 주간 점검과 나의 패턴을 찾는 재료가 돼요.</div>
        </section>
        ${list.length ? list.join('') : `
          <section class="card"><div class="sub">아직 기록이 없어요. 아침에 "일어났어요"를 누르면 쌓이기 시작해요.</div></section>`}
        <section class="card">
          <div class="card-title">💾 백업</div>
          <div class="sub" style="margin-bottom:12px">기록은 이 기기의 브라우저에만 저장돼요. 폰을 바꾸거나 브라우저 데이터를 지우기 전에 백업해 두세요.</div>
          <div class="row">
            <button class="ghost grow" data-act="export">⬇️ 백업 받기</button>
            <button class="ghost grow" data-act="import">⬆️ 불러오기</button>
          </div>
        </section>`;
    }

    function exportData() {
      const data = {
        app: 'my-secretary', version: 1, exportedAt: new Date().toISOString(),
        compass, days: dayLog, today: state, wakeHistory: history,
      };
      const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = `my-secretary-backup-${dateKey(Date.now())}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // 백업은 덮어쓰지 않고 합친다 (같은 날은 백업 쪽 기록 사용)
    async function importData(file) {
      try {
        const data = JSON.parse(await file.text());
        if (data.app !== 'my-secretary') throw new Error('not a backup');
        if (!confirm('백업을 불러올까요?\n지금 기록과 합치고, 삶의 방향은 백업 내용으로 바뀌어요.')) return;
        const byWake = new Map([...dayLog, ...(data.days || [])].map((d) => [d.wake, d]));
        if (data.today?.wake && data.today.wake !== state.wake) {
          if (!state.wake || data.today.wake > state.wake) { archiveDay(); state = fresh(data.today); }
          else byWake.set(data.today.wake, data.today);
        }
        byWake.delete(state.wake);
        dayLog = [...byWake.values()].sort((a, b) => a.wake - b.wake);
        const byDate = new Map([...history, ...(data.wakeHistory || [])].map((h) => [h.d, h]));
        history = [...byDate.values()].sort((a, b) => a.wake - b.wake).slice(-30);
        if (data.compass) compass = { ...DEFAULT_COMPASS, ...data.compass };
        saveKey(LOG, dayLog);
        saveKey(HIST, history);
        saveKey(COMPASS, compass);
        save();
        toast('백업을 불러왔어요');
        render();
      } catch {
        toast('백업 파일을 읽지 못했어요');
      }
    }

    function applyTheme(hue) {
      document.documentElement.style.setProperty('--hue', hue);
      const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (bg) $('themeColor').setAttribute('content', bg);
    }

    function render() {
      const app = $('app');
      const tlOpen = $('tl')?.open;
      $('title').textContent = TITLES[tab];
      document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
      if (tab !== 'today') {
        lastBlockId = null;
        applyTheme(dayActive() ? currentBlock().hue : 30);
        app.innerHTML = tab === 'compass' ? compassView() : recordsView();
        if (dayActive()) scheduleNotify();
        return;
      }
      if (!dayActive()) {
        lastBlockId = null;
        applyTheme(30);
        app.innerHTML = wakeView();
      } else {
        const b = currentBlock();
        lastBlockId = b.id;
        applyTheme(b.hue);
        app.innerHTML = nowView();
        if (tlOpen) $('tl').open = true;
        tick();
        scheduleNotify();
      }
    }

    // 입력 중에 화면이 다시 그려지지 않도록, 블록이 바뀔 때만 전체를 다시 그림
    function tick() {
      const d = new Date();
      $('today').textContent = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;

      if (tab !== 'today') return;
      if (!dayActive()) { if (lastBlockId !== null) render(); return; }
      const b = currentBlock();
      if (b.id !== lastBlockId) {
        render();
        toast(`${b.emoji} ${b.nudge}`);
        return;
      }
      if (checkTimer()) return;

      const e = elapsed();
      const left = Math.max(0, Math.ceil(b.end - e));
      $('remain').textContent = left > 0
        ? `${fmtDur(left)} 남음 · ${fmt(at(b.end))}까지`
        : `${fmt(at(b.end))}에 끝났어요`;
      $('bar').style.width = `${Math.min(100, ((e - b.start) / (b.end - b.start)) * 100)}%`;
      $('marker').style.left = `${Math.min(100, (e / LAST.end) * 100)}%`;
      document.querySelectorAll('.daybar i').forEach((i) => i.classList.toggle('past', e >= Number(i.dataset.end)));

      if (state.timer) {
        const ms = Math.max(0, state.timer.end - Date.now());
        const s = Math.ceil(ms / 1000);
        $('timerLeft').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        $('timerBar').style.width = `${100 - (ms / (state.timer.min * MIN)) * 100}%`;
      }
    }

    // ---------- 집중 타이머 ----------

    let timerTimeout = null;
    function scheduleTimer() {
      clearTimeout(timerTimeout);
      if (state.timer) timerTimeout = setTimeout(checkTimer, Math.max(0, state.timer.end - Date.now()) + 50);
    }
    function checkTimer() {
      if (!state.timer || Date.now() < state.timer.end) return false;
      const late = Date.now() - state.timer.end;
      const m = state.timer.min;
      state.timer = null;
      state.sessions += 1;
      save();
      if (late < MIN) notify('⏰ 집중 끝!', `${m}분 집중했어요. 이제 ${m >= 60 ? 10 : 5}분 쉬어요.`);
      toast(`🎉 ${m}분 집중 완료! 잠깐 쉬어요`);
      buzz([80, 60, 80]);
      render();
      return true;
    }

    // ---------- 알림 ----------

    let swReg = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then((r) => { swReg = r; }).catch(() => {});
    }
    function askNotify() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});
      }
    }
    function notify(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        if (swReg) swReg.showNotification(title, { body, icon: 'icons/icon-192.png' });
        else new Notification(title, { body });
      } catch {}
    }
    let notifyTimer = null;
    function scheduleNotify() {
      clearTimeout(notifyTimer);
      const next = BLOCKS.find((b) => b.start > elapsed());
      if (!next) return;
      notifyTimer = setTimeout(() => {
        notify(`${next.emoji} ${next.name}`, next.nudge);
        tick();
      }, at(next.start) - Date.now() + 50);
    }

    let toastTimer = null;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
    }

    function floatAway(text, from) {
      const r = from.getBoundingClientRect();
      const f = document.createElement('div');
      f.className = 'floater';
      f.textContent = `🍃 ${text}`;
      Object.assign(f.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px` });
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 2600);
    }

    // ---------- 동작 ----------

    $('app').addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-act]');
      if (!el) return;
      // 고르기만 하는 버튼은 화면을 다시 그리지 않음 (입력 중인 글이 지워지지 않게)
      const pick = (current) => {
        const v = Number(el.dataset.v);
        el.parentElement.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === el && current !== v));
        return current === v ? null : v;
      };
      switch (el.dataset.act) {
        case 'ci': {
          const k = el.dataset.k;
          checkinDraft[k] = pick(checkinDraft[k] ?? null) ?? undefined;
          $('ciSave').disabled = checkinDraft.energy == null;
          return;
        }
        case 'ci-save': {
          state.checkin = { ...checkinDraft, at: Date.now() };
          checkinDraft = {};
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        }
        case 'ci-skip': state.checkinSkipped = true; break;
        case 'ci-open': state.checkinSkipped = false; break;
        case 'ci-redo': {
          const { at: _, ...prev } = state.checkin;
          checkinDraft = prev;
          state.checkin = null;
          state.checkinSkipped = false;
          break;
        }
        case 'pick-pipe': pipeDraft = pick(pipeDraft); return;
        case 'pick-closing': {
          closingDraft = pick(closingDraft);
          $('closingSave').disabled = closingDraft == null;
          return;
        }
        case 'save-closing': {
          state.closing = {
            kind: closingDraft,
            step: $('closingStep').value.trim(),
            line: $('closingLine').value.trim(),
            at: Date.now(),
          };
          toast(`${CLOSING[closingDraft][0]} ${CLOSING[closingDraft][2]}`);
          closingDraft = null;
          closingPrefill = {};
          break;
        }
        case 'closing-edit': {
          closingDraft = state.closing.kind;
          closingPrefill = state.closing;
          state.closing = null;
          break;
        }
        case 'compass-edit': editingCompass = true; return render();
        case 'compass-cancel': editingCompass = false; return render();
        case 'compass-save': {
          compass = {
            goal: $('cGoal').value.trim() || DEFAULT_COMPASS.goal,
            pipelines: compass.pipelines.map((_, i) => ({
              emoji: $(`cpE${i}`).value.trim() || '•',
              name: $(`cpN${i}`).value.trim(),
              purpose: $(`cpP${i}`).value.trim(),
            })),
            principles: $('cPrin').value.split('\n').map((s) => s.trim()).filter(Boolean),
          };
          saveKey(COMPASS, compass);
          editingCompass = false;
          toast('삶의 방향을 저장했어요 🧭');
          return render();
        }
        case 'export': return exportData();
        case 'import': return $('importFile').click();
        case 'wake-now': return startDay(Date.now());
        case 'wake-at': return startDay(timeInputToStamp($('wakeTime').value || nowHHMM()));
        case 'open-timeline': {
          $('tl').open = true;
          $('tl').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        case 'edit-wake': editingWake = true; return render();
        case 'wake-fix': {
          forgetWake(state.wake);
          state.wake = timeInputToStamp($('wakeTime').value);
          recordWake(state.wake);
          editingWake = false;
          break;
        }
        case 'reset': {
          if (!confirm('처음 화면으로 돌아갈까요?\n오늘 기록이 모두 지워져요.')) return;
          forgetWake(state.wake);
          state = fresh();
          editingWake = false;
          clearTimeout(timerTimeout);
          break;
        }
        case 'toggle': {
          const k = el.dataset.key;
          state.done[k] = !state.done[k];
          buzz(10);
          break;
        }
        case 'energy': {
          const id = currentBlock().id, v = Number(el.dataset.v);
          state.energy[id] = state.energy[id] === v ? undefined : v;
          buzz(10);
          break;
        }
        case 'set-focus': {
          const v = $('focusInput').value.trim();
          if (!v) return;
          state.focusTask = v;
          state.focusPipe = pipeDraft == null ? null : pipeOptions()[pipeDraft];
          pipeDraft = null;
          break;
        }
        case 'clear-focus': state.focusTask = ''; state.focusPipe = null; state.focusDone = false; break;
        case 'focus-done': {
          state.focusDone = true;
          if (state.timer) { state.timer = null; state.sessions += 1; clearTimeout(timerTimeout); }
          buzz([30, 40, 30]);
          toast('🎉 오늘의 한 가지 끝! 남은 하루는 보너스예요');
          break;
        }
        case 'focus-undo': state.focusDone = false; break;
        case 'timer': {
          const m = Number(el.dataset.min);
          state.timer = { end: Date.now() + m * MIN, min: m };
          askNotify();
          scheduleTimer();
          break;
        }
        case 'stop-timer': {
          state.timer = null;
          clearTimeout(timerTimeout);
          toast('괜찮아요. 시작한 것만으로 충분해요 💜');
          break;
        }
        case 'set-tomorrow': {
          const v = $('tomorrowInput').value.trim();
          if (!v) return;
          state.tomorrowTask = v;
          break;
        }
        case 'clear-tomorrow': state.tomorrowTask = ''; break;
        case 'add-worry': {
          const ta = $('worryInput');
          const v = ta.value.trim();
          if (!v) return;
          floatAway(v, ta);
          state.worries.push(v);
          toast('내려놓았어요. 오늘은 여기 두고 가요 🍃');
          break;
        }
      }
      save();
      render();
    });

    // 한글 입력 중(조합 중)에는 Enter를 무시
    $('app').addEventListener('keydown', (ev) => {
      const act = ev.target.dataset?.enter;
      if (ev.key !== 'Enter' || !act || ev.isComposing) return;
      ev.preventDefault();
      $('app').querySelector(`[data-act="${act}"]`)?.click();
    });

    $('tabs').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-tab]');
      if (!b || b.dataset.tab === tab) return;
      tab = b.dataset.tab;
      editingCompass = false;
      window.scrollTo(0, 0);
      render();
    });

    $('importFile').addEventListener('change', (ev) => {
      const file = ev.target.files[0];
      ev.target.value = '';
      if (file) importData(file);
    });

    // ---------- 홈 화면 설치 ----------

    let installPrompt = null;
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    function renderInstall() {
      const el = $('install');
      if (standalone) el.innerHTML = '';
      else if (installPrompt) el.innerHTML = `<button class="ghost wide" id="installBtn" style="margin-bottom:12px">📲 홈 화면에 앱으로 설치</button>`;
      else if (isIOS) el.innerHTML = `<div class="hint">📲 Safari 아래 <b>공유</b> → <b>홈 화면에 추가</b>하면 앱처럼 쓰고 알림도 받을 수 있어요</div>`;
      else el.innerHTML = '';
    }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installPrompt = e;
      renderInstall();
    });
    $('install').addEventListener('click', async (ev) => {
      if (ev.target.id !== 'installBtn' || !installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice.catch(() => {});
      installPrompt = null;
      renderInstall();
    });

    // ---------- 숨 고르기 (두 번 들이쉬고 길게 내쉬기) ----------

    const PHASES = [
      { text: '코로 들이쉬기', ms: 2000, scale: 1.2 },
      { text: '한 번 더 살짝', ms: 1000, scale: 1.35 },
      { text: '입으로 길게 내쉬기', ms: 6000, scale: 0.8 },
    ];
    const CYCLES = 6;
    let breatheTimer = null;
    function breathe(cycle = 0, i = 0) {
      if (cycle >= CYCLES) {
        $('phase').textContent = '잘했어요 💜';
        $('phaseSub').textContent = '조금 가벼워졌길 바라요';
        return;
      }
      const p = PHASES[i];
      $('phase').textContent = p.text;
      $('phaseSub').textContent = `${cycle + 1} / ${CYCLES}`;
      $('circle').style.transitionDuration = `${p.ms}ms`;
      $('circle').style.transform = `scale(${p.scale})`;
      if (i === 0) buzz(20);
      breatheTimer = setTimeout(() => {
        const ni = (i + 1) % PHASES.length;
        breathe(ni === 0 ? cycle + 1 : cycle, ni);
      }, p.ms);
    }
    $('breatheBtn').addEventListener('click', () => {
      $('overlay').classList.add('show');
      $('circle').style.transitionDuration = '0ms';
      $('circle').style.transform = 'scale(.8)';
      $('phase').textContent = '편하게 앉아요';
      $('phaseSub').textContent = '';
      breatheTimer = setTimeout(() => breathe(), 1500);
    });
    $('breatheClose').addEventListener('click', () => {
      clearTimeout(breatheTimer);
      $('overlay').classList.remove('show');
    });

    render();
    tick();
    renderInstall();
    scheduleTimer();
    setInterval(tick, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  </script>
</body>
</html>
