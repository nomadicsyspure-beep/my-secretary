<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>나의 비서실</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2330;
      --sub: #6b7080;
      --accent: #4f46e5;
      --accent-soft: #eceafe;
      --line: #e6e8ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141b;
        --card: #1c1f2a;
        --text: #eceef4;
        --sub: #9aa0b2;
        --accent: #8b85ff;
        --accent-soft: #272a45;
        --line: #2a2e3b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      padding: max(20px, env(safe-area-inset-top)) 16px 96px;
      line-height: 1.5;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    header { margin: 12px 0 20px; }
    .date { color: var(--sub); font-size: 14px; }
    h1 { margin: 4px 0 0; font-size: 26px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
    }
    .sub { color: var(--sub); font-size: 14px; }
    .small { font-size: 12px; }
    button {
      font: inherit;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    button.link { background: none; color: var(--sub); padding: 6px 8px; font-weight: 400; font-size: 13px; text-decoration: underline; }
    .wide { width: 100%; }
    input[type=text], input[type=time], textarea {
      font: inherit;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
    }
    textarea { resize: vertical; min-height: 72px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > input { flex: 1; }

    /* 지금 블록 */
    .now-emoji { font-size: 44px; line-height: 1; }
    .now-name { font-size: 24px; font-weight: 700; margin: 8px 0 2px; }
    .remain { font-size: 15px; font-weight: 600; color: var(--accent); margin-top: 12px; }
    .bar { height: 8px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s; }
    .section-title { font-size: 13px; color: var(--sub); margin: 18px 0 8px; font-weight: 600; }
    .actions { list-style: none; padding: 0; margin: 0; }
    .actions li { padding: 8px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; cursor: pointer; }
    .actions li:first-child { border-top: 0; }
    .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 13px; }
    .done .check { background: var(--accent); border-color: var(--accent); color: #fff; }
    .done span { color: var(--sub); text-decoration: line-through; }
    .energy { display: flex; gap: 8px; }
    .energy button { flex: 1; background: var(--bg); border: 1px solid var(--line); font-size: 24px; padding: 10px; }
    .energy button.on { border-color: var(--accent); background: var(--accent-soft); }
    .minimum { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; }
    .one-thing { padding: 14px; border-radius: 12px; background: var(--accent-soft); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .next { display: flex; justify-content: space-between; align-items: center; }

    /* 전체 리듬 */
    details summary { cursor: pointer; color: var(--sub); font-size: 14px; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    .timeline { margin-top: 12px; }
    .tl { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
    .tl .t { width: 76px; color: var(--sub); font-size: 13px; flex: none; }
    .tl.past { opacity: .45; }
    .tl.cur b { color: var(--accent); }

    .worries { list-style: none; padding: 0; margin: 10px 0 0; }
    .worries li { color: var(--sub); font-size: 14px; padding: 6px 0; }
    .worries li::before { content: "🍃 "; }

    /* 숨 고르기 */
    .breathe-btn {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: max(20px, env(safe-area-inset-bottom));
      border-radius: 999px; padding: 14px 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
    }
    .overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 32px; padding: 24px; z-index: 10;
    }
    .overlay.show { display: flex; }
    .circle {
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, var(--accent-soft) 70%);
      transform: scale(.8);
      transition-property: transform; transition-timing-function: ease-in-out;
    }
    .phase { font-size: 22px; font-weight: 700; text-align: center; min-height: 33px; }

    footer { margin-top: 20px; color: var(--sub); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="date" id="today"></div>
      <h1>나의 비서실</h1>
    </header>
    <main id="app"></main>
    <footer>v0.2 · 뇌 리듬 하루 · 블록 시간은 일반적인 기본값이에요</footer>
  </div>

  <button class="breathe-btn" id="breatheBtn">🫁 숨 고르기</button>
  <div class="overlay" id="overlay">
    <div class="circle" id="circle"></div>
    <div>
      <div class="phase" id="phase">준비</div>
      <div class="sub" id="phaseSub" style="text-align:center"></div>
    </div>
    <button class="ghost" id="breatheClose">닫기</button>
  </div>

  <script>
    const KEY = 'rhythm.v1';
    const MIN = 60 * 1000;
    const DAY_LENGTH = 20 * 60; // 기상 후 20시간이 지나면 새 하루로 봄

    // start/end: 기상 후 몇 분
    const BLOCKS = [
      { id: 'wake', emoji: '☀️', name: '깨우기', start: 0, end: 60,
        state: '몸과 뇌가 켜지는 중이에요',
        actions: ['햇빛 10분 쬐기 (창가도 좋아요)', '물 한 잔 마시기', '카페인은 1시간쯤 뒤에'],
        minimum: '커튼만 열어도 충분해요',
        nudge: '좋은 아침이에요. 햇빛부터 조금 볼까요?' },
      { id: 'focus', emoji: '🔥', name: '집중 골든타임', start: 60, end: 240,
        state: '집중력과 분석력이 가장 높은 시간이에요',
        actions: ['가장 어려운 일 딱 1개', '90분 집중 → 10분 휴식', '알림·메신저 잠시 끄기'],
        minimum: '25분만 해도 충분해요. 시작한 것 자체가 잘한 거예요',
        nudge: '골든타임이 시작됐어요. 오늘의 한 가지만 해볼까요?' },
      { id: 'social', emoji: '💬', name: '소통·잡무', start: 240, end: 360,
        state: '아직 괜찮지만 조금씩 내려가는 중이에요',
        actions: ['연락 · 회의 · 메일', '정리 같은 가벼운 일', '점심 챙겨 먹기'],
        minimum: '답장 하나만 보내도 OK',
        nudge: '집중 시간 수고했어요. 이제 가벼운 일들 차례예요.' },
      { id: 'dip', emoji: '😴', name: '오후 처짐', start: 360, end: 480,
        state: '졸리고 집중이 떨어지는 게 정상이에요',
        actions: ['20분 낮잠 또는 10분 산책', '단순한 작업만', '물 마시기'],
        minimum: '눈 감고 5분만 쉬어요',
        nudge: '졸린 시간이 왔어요. 10분만 걸어볼까요?' },
      { id: 'rise', emoji: '🌊', name: '2차 상승', start: 480, end: 660,
        state: '몸과 창의력이 다시 올라오는 시간이에요',
        actions: ['운동이나 몸 움직이기', '아이디어 · 창작 작업', '좋아하는 취미'],
        minimum: '스트레칭 5분',
        nudge: '에너지가 다시 올라오는 시간이에요. 몸을 움직여 볼까요?' },
      { id: 'wind', emoji: '🌙', name: '감속', start: 660, end: 840,
        state: '잠들 준비를 시작할 시간이에요',
        actions: ['조명 낮추기', '화면 줄이기', '걱정 내려놓기 · 내일 한 가지 정하기'],
        minimum: '폰 밝기만 낮춰도 좋아요',
        nudge: '천천히 속도를 줄일 시간이에요. 조명을 낮춰볼까요?' },
      { id: 'sleep', emoji: '💤', name: '잘 준비', start: 840, end: 960,
        state: '이제 쉬어도 돼요',
        actions: ['따뜻한 샤워', '폰은 손 닿지 않는 곳에', '오늘도 수고했어요'],
        minimum: '누워서 숨 고르기 한 번',
        nudge: '오늘도 수고했어요. 이제 잘 준비해요.' },
    ];

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
    }
    let state = load();
    let editingWake = false;
    let lastBlockId = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (t) => new Date(t).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
    const at = (min) => state.wake + min * MIN;
    const elapsed = () => (Date.now() - state.wake) / MIN;
    const dayActive = () => state.wake && elapsed() >= 0 && elapsed() < DAY_LENGTH;

    function currentBlock() {
      const e = elapsed();
      return BLOCKS.find((b) => e >= b.start && e < b.end) || BLOCKS[BLOCKS.length - 1];
    }

    function startDay(wake) {
      state = {
        wake,
        focusTask: state.tomorrowTask || '',
        tomorrowTask: '',
        energy: {},
        done: {},
        worries: [],
      };
      editingWake = false;
      save();
      askNotify();
      render();
    }

    function timeInputToStamp(value) {
      const [h, m] = value.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      if (d.getTime() > Date.now()) d.setDate(d.getDate() - 1);
      return d.getTime();
    }

    function nowHHMM() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ---------- 화면 ----------

    function wakeView() {
      const carry = state.tomorrowTask;
      return `
        <div class="card" style="text-align:center; padding:32px 20px">
          <div class="now-emoji">☀️</div>
          <div class="now-name">좋은 아침이에요</div>
          <p class="sub">일어난 시각을 기준으로 오늘 하루 리듬을 짜드릴게요.</p>
          ${carry ? `<div class="one-thing" style="justify-content:center; margin:16px 0">오늘의 한 가지: ${esc(carry)}</div>` : ''}
          <button class="wide" data-act="wake-now">일어났어요</button>
          <div class="section-title" style="text-align:left">조금 전에 일어났다면</div>
          <div class="row">
            <input type="time" id="wakeTime" value="${nowHHMM()}">
            <button class="ghost" data-act="wake-at">이 시각으로</button>
          </div>
        </div>`;
    }

    function nowView() {
      const b = currentBlock();
      const e = elapsed();
      const over = e >= BLOCKS[BLOCKS.length - 1].end;
      const idx = BLOCKS.indexOf(b);
      const next = BLOCKS[idx + 1];
      const energy = state.energy[b.id];

      const actions = b.actions.map((a, i) => {
        const done = state.done[`${b.id}.${i}`];
        return `<li class="${done ? 'done' : ''}" data-act="toggle" data-key="${b.id}.${i}">
          <div class="check">${done ? '✓' : ''}</div><span>${esc(a)}</span></li>`;
      }).join('');

      let extra = '';
      if (b.id === 'focus' || b.id === 'wake') {
        extra = `<div class="section-title">오늘의 한 가지</div>` + (state.focusTask
          ? `<div class="one-thing"><span>${esc(state.focusTask)}</span><button class="link" data-act="clear-focus">바꾸기</button></div>`
          : `<div class="row"><input type="text" id="focusInput" placeholder="골든타임에 할 일 하나만"><button data-act="set-focus">정하기</button></div>`);
      }
      if (b.id === 'wind' || b.id === 'sleep') {
        extra = `
          <div class="section-title">걱정 내려놓기</div>
          <textarea id="worryInput" placeholder="머릿속에 맴도는 걸 그냥 적어요. 적으면 여기 두고 가는 거예요."></textarea>
          <button class="ghost wide" style="margin-top:8px" data-act="add-worry">내려놓기</button>
          ${state.worries.length ? `<ul class="worries">${state.worries.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
          <div class="section-title">내일 골든타임에 할 한 가지</div>
          ${state.tomorrowTask
            ? `<div class="one-thing"><span>${esc(state.tomorrowTask)}</span><button class="link" data-act="clear-tomorrow">바꾸기</button></div>`
            : `<div class="row"><input type="text" id="tomorrowInput" placeholder="딱 하나만"><button data-act="set-tomorrow">정하기</button></div>`}`;
      }

      return `
        <div class="card">
          <div class="now-emoji">${b.emoji}</div>
          <div class="now-name">${b.name}</div>
          <div class="sub">${b.state}</div>
          <div class="remain" id="remain"></div>
          <div class="bar"><i id="bar"></i></div>

          <div class="section-title">지금 하면 좋은 것</div>
          <ul class="actions">${actions}</ul>

          ${extra}

          <div class="section-title">지금 컨디션은?</div>
          <div class="energy">
            ${['😫', '😐', '🙂'].map((em, i) => `<button class="${energy === i ? 'on' : ''}" data-act="energy" data-v="${i}">${em}</button>`).join('')}
          </div>
          ${energy === 0 ? `<div class="minimum">💜 오늘은 최소 버전으로 가요. <b>${esc(b.minimum)}</b></div>` : ''}
        </div>

        <div class="card next">
          ${next && !over
            ? `<div><div class="sub small">다음</div><b>${next.emoji} ${next.name}</b></div><div class="sub">${fmt(at(next.start))}</div>`
            : `<div><b>오늘 리듬 끝</b><div class="sub small">${over ? '잘 시간이 지났어요. 푹 자요 💤' : '푹 쉬어요'}</div></div>`}
        </div>

        <div class="card">
          <details>
            <summary>📋 오늘 전체 리듬 보기 · 기상 ${fmt(state.wake)}</summary>
            <div class="timeline">
              ${BLOCKS.map((x) => `
                <div class="tl ${x === b ? 'cur' : (e >= x.end ? 'past' : '')}">
                  <div class="t">${fmt(at(x.start))}</div>
                  <div>${x.emoji} <b>${x.name}</b></div>
                </div>`).join('')}
            </div>
            <div style="margin-top:12px">
              ${editingWake
                ? `<div class="row"><input type="time" id="wakeTime" value="${new Date(state.wake).toTimeString().slice(0, 5)}"><button class="ghost" data-act="wake-fix">수정</button></div>`
                : `<button class="link" data-act="edit-wake">기상 시각 수정</button>`}
              <button class="link" data-act="reset">오늘 다시 시작</button>
            </div>
          </details>
        </div>`;
    }

    function render() {
      const app = $('app');
      const openDetails = app.querySelector('details')?.open;
      if (!dayActive()) {
        lastBlockId = null;
        app.innerHTML = wakeView();
      } else {
        lastBlockId = currentBlock().id;
        app.innerHTML = nowView();
        if (openDetails) app.querySelector('details').open = true;
        tick();
        scheduleNotify();
      }
    }

    // 입력 중에 화면이 다시 그려지지 않도록, 블록이 바뀔 때만 전체를 다시 그림
    function tick() {
      const d = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      $('today').textContent = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;

      if (!dayActive()) { if (lastBlockId !== null) render(); return; }
      const b = currentBlock();
      if (b.id !== lastBlockId) { render(); return; }

      const e = elapsed();
      const left = Math.max(0, Math.ceil(b.end - e));
      const pct = Math.min(100, ((e - b.start) / (b.end - b.start)) * 100);
      const h = Math.floor(left / 60), m = left % 60;
      $('remain').textContent = left > 0
        ? `${h ? `${h}시간 ` : ''}${m}분 남음 · ${fmt(at(b.end))}까지`
        : `${fmt(at(b.end))}에 끝났어요`;
      $('bar').style.width = `${pct}%`;
    }

    // ---------- 알림 ----------

    let swReg = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then((r) => { swReg = r; }).catch(() => {});
    }
    function askNotify() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});
      }
    }
    function notify(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        if (swReg) swReg.showNotification(title, { body });
        else new Notification(title, { body });
      } catch {}
    }
    let notifyTimer = null;
    function scheduleNotify() {
      clearTimeout(notifyTimer);
      const next = BLOCKS.find((b) => b.start > elapsed());
      if (!next) return;
      const ms = at(next.start) - Date.now();
      notifyTimer = setTimeout(() => {
        notify(`${next.emoji} ${next.name}`, next.nudge);
        render();
      }, ms);
    }

    // ---------- 동작 ----------

    $('app').addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-act]');
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'wake-now') return startDay(Date.now());
      if (act === 'wake-at') return startDay(timeInputToStamp($('wakeTime').value || nowHHMM()));
      if (act === 'edit-wake') { editingWake = true; return render(); }
      if (act === 'wake-fix') {
        state.wake = timeInputToStamp($('wakeTime').value);
        editingWake = false;
        save();
        return render();
      }
      if (act === 'reset') {
        if (confirm('오늘 기록을 지우고 다시 시작할까요?')) { state = { tomorrowTask: state.tomorrowTask }; save(); render(); }
        return;
      }
      if (act === 'toggle') { state.done[el.dataset.key] = !state.done[el.dataset.key]; }
      if (act === 'energy') {
        const id = currentBlock().id, v = Number(el.dataset.v);
        state.energy[id] = state.energy[id] === v ? undefined : v;
      }
      if (act === 'set-focus') { const v = $('focusInput').value.trim(); if (!v) return; state.focusTask = v; }
      if (act === 'clear-focus') state.focusTask = '';
      if (act === 'set-tomorrow') { const v = $('tomorrowInput').value.trim(); if (!v) return; state.tomorrowTask = v; }
      if (act === 'clear-tomorrow') state.tomorrowTask = '';
      if (act === 'add-worry') { const v = $('worryInput').value.trim(); if (!v) return; state.worries.push(v); }
      save();
      render();
    });

    // ---------- 숨 고르기 (두 번 들이쉬고 길게 내쉬기) ----------

    const PHASES = [
      { text: '코로 들이쉬기', ms: 2000, scale: 1.2 },
      { text: '한 번 더 살짝', ms: 1000, scale: 1.35 },
      { text: '입으로 길게 내쉬기', ms: 6000, scale: 0.8 },
    ];
    const CYCLES = 6;
    let breatheTimer = null;
    function breathe(cycle = 0, i = 0) {
      if (cycle >= CYCLES) {
        $('phase').textContent = '잘했어요 💜';
        $('phaseSub').textContent = '조금 가벼워졌길 바라요';
        return;
      }
      const p = PHASES[i];
      $('phase').textContent = p.text;
      $('phaseSub').textContent = `${cycle + 1} / ${CYCLES}`;
      $('circle').style.transitionDuration = `${p.ms}ms`;
      $('circle').style.transform = `scale(${p.scale})`;
      breatheTimer = setTimeout(() => {
        const ni = (i + 1) % PHASES.length;
        breathe(ni === 0 ? cycle + 1 : cycle, ni);
      }, p.ms);
    }
    $('breatheBtn').addEventListener('click', () => {
      $('overlay').classList.add('show');
      $('circle').style.transitionDuration = '0ms';
      $('circle').style.transform = 'scale(.8)';
      $('phase').textContent = '편하게 앉아요';
      $('phaseSub').textContent = '';
      breatheTimer = setTimeout(() => breathe(), 1500);
    });
    $('breatheClose').addEventListener('click', () => {
      clearTimeout(breatheTimer);
      $('overlay').classList.remove('show');
    });

    render();
    tick();
    setInterval(tick, 30 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  </script>
</body>
</html>
